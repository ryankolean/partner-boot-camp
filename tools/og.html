<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #F5EFE6; color: #2B2522; overflow: hidden; }
  .wrap { position: relative; height: 100%; padding: 72px 80px; box-sizing: border-box; display: grid; grid-template-columns: 1.5fr 1fr; align-items: center; }
  h1 { font: 350 104px/0.95 "Fraunces", serif; font-variation-settings: "SOFT" 100, "WONK" 1; letter-spacing: -0.03em; margin: 0 0 28px; }
  p { font: italic 400 32px/1.3 "Fraunces", serif; margin: 0; max-width: 560px; }
  .mark { position: absolute; left: 80px; top: 56px; font: 400 26px "Fraunces", serif; display: flex; gap: 10px; align-items: center; }
  svg.art { width: 360px; fill: none; stroke: #7A7D5C; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
  .accent { stroke: #C96F4A; }
  .petal { position: absolute; width: 20px; fill: #E8C4B8; }
</style>
</head>
<body>
<div class="wrap">

    <path d="M50 164 h-10 a14 14 0 0 0 0 28 h11"/>
    <path d="M200 150 h70 v50 a26 26 0 0 1 -26 26 h-18 a26 26 0 0 1 -26 -26 z"/>
    <path d="M270 164 h10 a14 14 0 0 1 0 28 h-11"/>
    <path d="M34 238 h112 M184 238 h112"/>
    <path class="accent" d="M282 70 v16 M274 78 h16 M34 84 v10 M29 89 h10"/>

</div>

</body>
</html>
